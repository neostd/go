name: xscript

on:
  push:
    paths:
      - 'xscript/**'
      - '.github/workflows/xscript.yml'
    tags:
      - 'xscript/v*'
    branches:
      - '**'
  pull_request:
    paths:
      - 'xscript/**'
      - '.github/workflows/xscript.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ImageOS: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu24' || matrix.os == 'windows-latest' && 'win25' || 'macos15' }}
    defaults:
      run:
        working-directory: ./xscript
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false

      - name: Show mise path
        run: |
          mise --version
          command -v mise

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: xscript/go.mod
          check-latest: true
          cache-dependency-path: xscript/go.sum

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: lts

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'

      - name: Install extra shell runtimes on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish lua5.4 groovy
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua

      - name: Restore module state
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          USE_MISE_FOR_TESTING: 'true'
        run: go test -v ./...

  health:
    name: Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./xscript
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: xscript/go.sum

      - name: Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Lint
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7 # v9
        with:
          version: latest
          working-directory: ./xscript
